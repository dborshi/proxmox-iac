name: Run changed Ansible roles

on:
  push:
    paths:
      - 'ansible/roles/**'

jobs:
  detect:
    runs-on: docker
    container:
      image: git.dbnet.work/dborshi/ansible-runner:latest
    outputs:
      changed_roles: ${{ steps.extract.outputs.roles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          list-files: json
          filters: |
            roles:
              - 'ansible/roles/**'

      - name: Extract role names
        id: extract
        run: |
          set -euo pipefail
          FILES='${{ steps.filter.outputs.roles_files }}'

          if [ "$FILES" = "[]" ] || [ -z "$FILES" ]; then
            echo "roles=[]" >> "$GITHUB_OUTPUT"
          else
            ROLES=$(echo "$FILES" | jq -c '[.[] | split("/") | .[2]] | unique')
            echo "$ROLES" | jq empty
            echo "roles=$ROLES" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug changed files
        run: |
          echo '${{ steps.filter.outputs.roles_files }}' | jq .

      - name: Debug changed roles
        run: |
          echo '${{ steps.extract.outputs.roles }}'

  deploy:
    needs: detect
    if: needs.detect.outputs.changed_roles != '[]'
    runs-on: docker
    container:
      image: git.dbnet.work/dborshi/ansible-runner:latest
    strategy:
      matrix:
        role: ${{ fromJson(needs.detect.outputs.changed_roles) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read target hosts from role meta
        id: hosts
        run: |
          set -euo pipefail
          META="ansible/roles/${{ matrix.role }}/meta/hosts.yml"

          if [ ! -f "$META" ]; then
            echo "ERROR: missing meta file $META" >&2
            exit 1
          fi

          TARGET=$(yq '.target_hosts' "$META")

          if [ -z "$TARGET" ] || [ "$TARGET" = "null" ]; then
            echo "ERROR: target_hosts missing or empty in $META" >&2
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Run role
        env:
          ROLE: ${{ matrix.role }}
          TARGET: ${{ steps.hosts.outputs.target }}
          ANSIBLE_ROLES_PATH: ansible/roles
        run: |
          printf '%s\n' \
            '---' \
            "- name: Apply role $ROLE" \
            "  hosts: $TARGET" \
            '  become: true' \
            '  roles:' \
            "    - role: $ROLE" \
            > /tmp/playbook.yml

          echo "=== Generated playbook ===" && cat /tmp/playbook.yml

          ansible-playbook /tmp/playbook.yml \
            -i ansible/inventory/hosts.ini \
            --diff