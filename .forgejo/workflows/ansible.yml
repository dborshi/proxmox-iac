name: Run changed Ansible roles

on:
  push:
    paths:
      - 'ansible/roles/**'

jobs:

  detect:
    runs-on: docker
    container:
      image: git.dbnet.work/dborshi/ansible-runner:latest

    outputs:
      changed_roles: ${{ steps.diff.outputs.roles }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed roles as JSON array
        id: diff
        run: |
          set -e

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          # Handle first commit or invalid SHAs
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE"^{commit} 2>/dev/null; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          ROLES=$(git diff --name-only "$BASE" "$HEAD" \
            | grep '^ansible/roles/' || true \
            | awk -F'/' '{print $3}' \
            | sort -u \
            | jq -R . \
            | jq -s .)

          echo "roles=$ROLES" >> $GITHUB_OUTPUT
          echo "Detected: $ROLES"


  deploy:
    needs: detect
    if: needs.detect.outputs.changed_roles != '[]'
    runs-on: docker
    container:
      image: git.dbnet.work/dborshi/ansible-runner:latest

    strategy:
      matrix:
        role: ${{ fromJson(needs.detect.outputs.changed_roles) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Read target hosts from role meta
        id: hosts
        run: |
          set -e

          META="ansible/roles/${{ matrix.role }}/meta/hosts.yml"

          if [ ! -f "$META" ]; then
            echo "ERROR: missing meta file $META"
            exit 1
          fi

          TARGET=$(grep -E '^target_hosts:' "$META" | awk '{print $2}')

          if [ -z "$TARGET" ]; then
            echo "ERROR: target_hosts is empty for role ${{ matrix.role }}"
            exit 1
          fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Run role
        run: |
          cat > /tmp/playbook.yml <<EOF
          ---
          - name: Apply ${{ matrix.role }}
            hosts: ${{ steps.hosts.outputs.target }}
            become: true
            roles:
              - role: ${{ matrix.role }}
          EOF

          ansible-playbook /tmp/playbook.yml \
            -i ansible/inventory/hosts.ini