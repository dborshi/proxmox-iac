- name: Install dependencies
  ansible.builtin.apt:
    name:
      - git
      - jq
      - python3
      - pip
      - ansible
      - openssh-client
    state: present
    update_cache: true

- name: Create Forgejo runner data directory
  ansible.builtin.file:
    path: /opt/forgejo-runner/data
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0775"

- name: Create cache directory with setgid
  ansible.builtin.file:
    path: /opt/forgejo-runner/data/.cache
    state: directory
    owner: "1000"
    group: "1000"
    mode: "2775"

- name: Deploy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "/opt/forgejo-runner/.env"
    mode: "0600"
  notify: Restart stack

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/forgejo-runner/docker-compose.yml"
    mode: "0640"
  notify: Restart stack

- name: Start Forgejo stack
  community.docker.docker_compose_v2:
    project_src: "/opt/forgejo-runner"
    state: present
    pull: always
