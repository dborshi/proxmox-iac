- name: Create Talos VM template on Proxmox
  hosts: proxmox
  become: true

  vars:
    vmid: 9000
    storage: local-lvm
    image_url: "https://factory.talos.dev/image/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba/v1.13.1/metal-amd64.raw.zst"
    image_zst: "/tmp/metal-amd64.raw.zst"
    image_raw: "/tmp/metal-amd64.raw"

  tasks:

    - name: Download Talos raw image (compressed)
      get_url:
        url: "{{ image_url }}"
        dest: "{{ image_zst }}"
        mode: "0644"

    - name: Install zstd if missing
      apt:
        name: zstd
        state: present
        update_cache: true

    - name: Decompress image
      command: "zstd -d {{ image_zst }} -o {{ image_raw }}"
      args:
        creates: "{{ image_raw }}"

    - name: Destroy VM if exists
      command: qm destroy {{ vmid }}
      ignore_errors: true

    - name: Create VM
      command: >
        qm create {{ vmid }}
        --name talos-template
        --memory 4096
        --cores 2
        --net0 virtio,bridge=vmbr0
        --ostype l26

    - name: Import disk into Proxmox storage
      command: >
        qm importdisk {{ vmid }} {{ image_raw }} {{ storage }}

    - name: Attach disk to VM
      command: >
        qm set {{ vmid }}
        --scsihw virtio-scsi-pci
        --scsi0 {{ storage }}:vm-{{ vmid }}-disk-0

    - name: Set boot order
      command: qm set {{ vmid }} --boot c --bootdisk scsi0

    - name: Enable serial console (required for Talos)
      command: qm set {{ vmid }} --serial0 socket --vga serial0

    - name: Convert VM to template
      command: qm template {{ vmid }}