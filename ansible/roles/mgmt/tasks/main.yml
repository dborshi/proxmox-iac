---
- name: Install base Debian packages
  ansible.builtin.apt:
    name:
      - age
      - ca-certificates
      - git
      - gnupg
      - jq
      - kmod
      - openssh-client
      - pipx
      - python3
      - python3-venv
      - python3-requests
      - python3-docker
      - qemu-guest-agent
      - tar
      - unzip
      - xz-utils
      - zstd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create management tool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ management_tool_cache_directory }}"
    - "{{ management_tool_extract_directory }}"

- name: Install Ansible and controller dependencies
  ansible.builtin.import_tasks: ansible.yml

- name: Install latest management CLI tools
  ansible.builtin.import_tasks: tools.yml

- name: Enable QEMU Guest Agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Load TUN at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/tun.conf
    content: "tun"
    owner: root
    group: root
    mode: "0644"

- name: Load TUN now
  ansible.builtin.command:
    argv:
      - modprobe
      - tun
  changed_when: false

- name: Prepare the latest Omni image without starting the service
  ansible.builtin.import_tasks: omni_prepare.yml
