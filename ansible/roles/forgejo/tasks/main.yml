---
- name: Create Forgejo directory
  ansible.builtin.file:
    path: /opt/appdata/forgejo
    state: directory
    owner: 1000
    group: 1000
    recurse: true
    mode: "0750"

- name: Deploy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "/opt/appdata/forgejo/.env"
    mode: "0600"
  notify: Restart stack

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/appdata/forgejo/docker-compose.yml"
    mode: "0640"

- name: Start Forgejo stack
  community.docker.docker_compose_v2:
    project_src: "/opt/appdata/forgejo"
    state: present
    pull: always
