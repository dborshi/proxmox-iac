- name: Install required packages
  ansible.builtin.apt:
    name:
      - vainfo
      - mesa-va-drivers
      - libva2
    state: present
    update_cache: true

- name: Create Arr directory
  ansible.builtin.file:
    path: /opt/appdata/arr
    state: directory
    mode: "0750"

- name: Deploy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: /opt/appdata/arr/.env
    mode: "0600"
  notify: Restart stack

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/appdata/arr/docker-compose.yml
    mode: "0640"
  notify: Restart stack

- name: Start Arr stack
  community.docker.docker_compose_v2:
    project_src: "/opt/appdata/arr"
    state: present
    pull: always