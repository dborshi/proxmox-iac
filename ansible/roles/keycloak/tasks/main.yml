---
- name: Create Keycloak directory
  ansible.builtin.file:
    path: /opt/appdata/keycloak
    state: directory
    mode: "0750"

- name: Deploy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "/opt/appdata/keycloak/.env"
    mode: "0600"
  notify: Restart stack

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/appdata/keycloak/docker-compose.yml"
    mode: "0640"

- name: Start Keycloak stack
  community.docker.docker_compose_v2:
    project_src: "/opt/appdata/keycloak"
    state: present
    pull: always
