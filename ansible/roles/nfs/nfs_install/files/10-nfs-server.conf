# Managed by Ansible -- roles/nfs/nfs_install/files/10-nfs-server.conf

[nfsd]
# Legacy versions off. Disabling v3 is what lets us mask rpcbind entirely.
vers2 = n
vers3 = n

vers4.0 = n
vers4.1 = y
vers4.2 = y

threads = 16

[mountd]
# Package default is y. Off here: it resolves supplementary groups from the
# server's passwd database, which is wrong when UIDs are bare numbers with no
# local user behind them.
manage-gids = n