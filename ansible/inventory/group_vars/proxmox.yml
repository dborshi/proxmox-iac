proxmox_api_host: 10.0.0.10

proxmox_api_user: ansible@pam
proxmox_api_token_id: ansible-token

proxmox_api_token_secret: >-
  {{ lookup(
    'bitwarden.secrets.lookup',
    bw_proxmox_ansible_token,
    base_url='https://vault.bitwarden.eu'
  ) }}

proxmox_api_validate_certs: false
proxmox_api_timeout: 10
