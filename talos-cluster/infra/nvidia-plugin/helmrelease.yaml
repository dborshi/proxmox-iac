apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: flux-system
spec:
  interval: 30m

  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.20.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3

  targetNamespace: nvidia-device-plugin

  values:
    nodeSelector:
      kubernetes.io/hostname: talos-wk-1

    config:
      default: time-slicing
      map:
        time-slicing: |-
          version: v1
          sharing:
            timeSlicing:
              renameByDefault: true
              failRequestsGreaterThanOne: true
              resources:
                - name: nvidia.com/gpu
                  replicas: 2