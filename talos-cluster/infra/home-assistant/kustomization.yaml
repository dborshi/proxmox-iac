apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

resources:
  - namespace.yaml
  - helmrepository.yaml
  - pvc.yaml
  - helmrelease.yaml
  - secret.yaml

configMapGenerator:
  - name: home-assistant-config-src
    files:
      - config/configuration.yaml
      - config/automations.yaml
      - config/scripts.yaml

generatorOptions:
  disableNameSuffixHash: true