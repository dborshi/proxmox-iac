apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: home-assistant
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120

    controllers:
      home-assistant:
        type: statefulset

        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet

        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
            env:
              TZ: Europe/Tirana
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  periodSeconds: 10
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      main:
        controller: home-assistant
        type: ClusterIP
        ports:
          http:
            port: 8123

    ingress:
      main:
        className: cilium
        hosts:
          - host: ha.dbnet.work
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http

    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config

      gitops-config:
        type: configMap
        name: home-assistant-config-src
        advancedMounts:
          home-assistant:
            main:
              - path: /config/configuration.yaml
                subPath: configuration.yaml
                readOnly: true
              - path: /config/automations.yaml
                subPath: automations.yaml
                readOnly: true
              - path: /config/scripts.yaml
                subPath: scripts.yaml
                readOnly: true
              - path: /config/scenes.yaml
                subPath: scenes.yaml
                readOnly: true

      gitops-secrets:
        type: secret
        name: home-assistant-secrets
        advancedMounts:
          home-assistant:
            main:
              - path: /config/secret.yaml
                subPath: secret.yaml
                readOnly: true
