apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 1h
  chart:
    spec:
      chart: openebs
      version: ">=4.0.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        rawfile:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    localpv-provisioner:
      enabled: true
      localpv:
        basePath: /var/mnt/openebs-data
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: true
        reclaimPolicy: Delete