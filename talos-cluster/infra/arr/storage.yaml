apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-media
spec:
  capacity:
    storage: 4.5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - noatime
  nfs:
    server: 10.0.0.14
    path: /srv/nfs/arr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: arr-media
  resources:
    requests:
      storage: 4.5Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
