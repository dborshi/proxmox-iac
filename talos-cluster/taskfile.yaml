version: '3'

tasks:
  # ── Terraform ──────────────────────────────────────────
  tf:init:
    desc: Initialize Terraform
    dir: terraform
    cmds: [terraform init]

  tf:plan:
    desc: Plan VM provisioning
    dir: terraform
    cmds: [terraform plan]

  tf:apply:
    desc: Create the 3 VMs on Proxmox
    dir: terraform
    cmds: [terraform apply -auto-approve]

  tf:destroy:
    desc: Destroy all VMs
    dir: terraform
    cmds: [terraform destroy -auto-approve]

  # ── Talos config ───────────────────────────────────────
  talos:gensecret:
    desc: Generate + encrypt cluster secrets
    dir: talos
    cmds:
      - talhelper gensecret > talsecret.sops.yaml
      - sops -e -i talsecret.sops.yaml

  talos:genconfig:
    desc: Generate all node configs from talconfig.yaml
    dir: talos
    cmds: [talhelper genconfig]

  # ── Bootstrap ──────────────────────────────────────────
  talos:apply-cp-insecure:
    desc: Apply config to control plane node
    dir: talos
    cmds:
      - talosctl apply-config --insecure --nodes 10.0.0.41
          --file clusterconfig/dbnet-talos-cp-1.yaml

  talos:apply-workers-insecure:
    desc: Apply config to worker nodes
    dir: talos
    cmds:
      - talosctl apply-config --insecure --nodes 10.0.0.42
          --file clusterconfig/dbnet-talos-wk-1.yaml
      - talosctl apply-config --insecure --nodes 10.0.0.43
          --file clusterconfig/dbnet-talos-wk-2.yaml

  talos:bootstrap:
    desc: Bootstrap etcd on the control plane (run ONCE)
    cmds:
      - talosctl bootstrap --nodes 10.0.0.41
          --talosconfig talos/clusterconfig/talosconfig

  talos:kubeconfig:
    desc: Fetch kubeconfig
    cmds:
      - talosctl kubeconfig --nodes 10.0.0.41
          --talosconfig talos/clusterconfig/talosconfig

  talos:upgrade:
    desc: Upgrade Talos on all nodes
    dir: talos
    cmds:
      - talhelper genconfig
      - talhelper gencommand upgrade -n talos-wk-1 | bash
      - kubectl wait --for=condition=Ready node/talos-wk-1 --timeout=10m
      - talhelper gencommand upgrade -n talos-wk-2 | bash
      - kubectl wait --for=condition=Ready node/talos-wk-2 --timeout=10m
      - talhelper gencommand upgrade -n talos-cp-1 | bash

  k8s:upgrade:
    desc: Upgrade Kubernetes (version from talconfig.yaml)
    dir: talos
    cmds:
      - talhelper genconfig
      - talhelper gencommand upgrade-k8s | bash

  # Export export GITEA_TOKEN= in .env
  flux:bootstrap:
    desc: Bootstrap Flux on the cluster
    cmds:
      - flux bootstrap gitea \
          --token-auth \
          --hostname=git.dbnet.work \
          --owner=dborshi \
          --repository=proxmox-iac \
          --branch=main \
          --path=./talos-cluster/infra \
          --personal

  # ── Full bring-up sequence ─────────────────────────────
  up:
    desc: Full cluster bootstrap from scratch
    cmds:
      - task: tf:apply
      - task: talos:genconfig
      - task: talos:apply-cp-insecure
      - task: talos:apply-workers-insecure
      - task: talos:bootstrap
      - task: talos:kubeconfig

  talos:apply-cp:
    desc: Apply config to control plane node
    dir: talos
    cmds:
      - talosctl apply-config --nodes 10.0.0.41
          --file clusterconfig/dbnet-talos-cp-1.yaml

  talos:apply-wk:
    desc: Apply config to worker nodes
    dir: talos
    cmds:
      - talosctl apply-config --nodes 10.0.0.42
          --file clusterconfig/dbnet-talos-wk-1.yaml
      - talosctl apply-config --nodes 10.0.0.43
          --file clusterconfig/dbnet-talos-wk-2.yaml

  apply:
    desc: Apply config to all nodes
    cmds:
      - task: talos:genconfig
      - task: talos:apply-cp
      - task: talos:apply-wk

# ── CNI migration: Flannel → Cilium ────────────────────
  cni:remove-flannel:
    desc: Delete Flannel resources
    cmds:
      - kubectl delete namespace kube-flannel --ignore-not-found
      - kubectl -n kube-system delete ds kube-flannel --ignore-not-found

  cni:remove-kubeproxy:
    desc: Delete kube-proxy
    cmds:
      - kubectl -n kube-system delete ds kube-proxy --ignore-not-found
      - kubectl -n kube-system delete cm kube-proxy --ignore-not-found

  cni:reconcile-cilium:
    desc: Force Flux to reconcile the Cilium HelmRelease
    cmds:
      - flux reconcile source git flux-system
      - flux reconcile kustomization flux-system

  cni:reboot-cp:
    desc: Reboot control plane node to clear stale Flannel interfaces
    cmds:
      - talosctl reboot --nodes 10.0.0.41
          --talosconfig talos/clusterconfig/talosconfig

  cni:reboot-workers:
    desc: Reboot worker nodes one at a time
    cmds:
      - talosctl reboot --nodes 10.0.0.42
          --talosconfig talos/clusterconfig/talosconfig
      - sleep 30
      - talosctl reboot --nodes 10.0.0.43
          --talosconfig talos/clusterconfig/talosconfig

  cni:verify:
    desc: Check Cilium pods and node status after migration
    cmds:
      - kubectl get pods -n kube-system -l k8s-app=cilium -o wide
      - kubectl get pods -n kube-system -l k8s-app=cilium-operator
      - kubectl get nodes

  # ── Full migration sequence ─────────────────────────────
  cni:migrate:
    desc: >
      Migrate Flannel -> Cilium. Requires talconfig.yaml already patched
      with cluster.network.cni.name: none (and proxy.disabled: true if
      using kube-proxy replacement) before running this.
    cmds:
      - task: talos:genconfig
      - task: talos:apply-cp
      - task: talos:apply-wk
      - task: cni:reconcile-cilium
      - task: cni:remove-flannel
      - task: cni:remove-kubeproxy
      - task: cni:reboot-cp
      - task: cni:reboot-workers
      - task: cni:verify